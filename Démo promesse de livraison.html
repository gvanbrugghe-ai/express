<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Démo promesse de livraison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style id="css">
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:light;
  --bg:#fff;--ink:#1a1a1a;--ink-2:#3f3f3f;--muted:#6e6e6e;--line:#e6e6e6;--line-2:#cdcdcd;--soft:#f3f3f3;
  --ok:#0d7546;--ok-bg:#e8f3ec;--low:#b86a00;--off:#a3a3a3;--err:#b3261e;--focus:#1f5ce0;--edit:#1f5ce0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 84px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Instrument Sans","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:#fff}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
button:disabled{cursor:not-allowed}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ico{display:block;flex:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Barre d'annonce et header */
.topbar{background:var(--ink);color:#fff;font-size:12.5px;text-align:center;padding:8px 16px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.hdr-in{max-width:1320px;margin:0 auto;padding:0 32px;height:72px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:24px}
.hdr-l{display:flex;align-items:center;gap:6px;min-width:0}
.logo{font-weight:700;font-size:20px;letter-spacing:.3em;text-decoration:none;white-space:nowrap}
.nav{display:flex;gap:28px;font-size:14px;font-weight:500}
.nav a{text-decoration:none;padding:6px 0;border-bottom:1.5px solid transparent}
.nav a:hover{border-bottom-color:currentColor}
.hdr-r{display:flex;align-items:center;justify-content:flex-end;gap:2px}
.search{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;background:var(--soft);border-radius:19px;margin-right:10px;width:210px;color:var(--muted)}
.search .ico{width:17px;height:17px}
.search input{border:0;background:transparent;outline:0;width:100%;font-size:13.5px;color:var(--ink)}
.search input::-webkit-search-cancel-button{display:none}
.search:focus-within{outline:2px solid var(--focus)}
.ib{width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;position:relative;border-radius:50%}
.ib .ico{width:21px;height:21px}
.ib:hover{background:var(--soft)}
.badge{position:absolute;top:2px;right:1px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--ink);color:#fff;font-size:10.5px;font-weight:600;line-height:17px;text-align:center}
.burger{display:none}
.mnav{display:none}

/* Fil d'Ariane */
.crumbs{max-width:1320px;margin:0 auto;padding:16px 32px;font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px}
.crumbs a{text-decoration:none}
.crumbs a:hover{text-decoration:underline}

/* Fiche produit */
.pdp{max-width:1320px;margin:0 auto;padding:0 32px 72px;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:56px;align-items:start}
.media{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px)}
.ph{position:relative;display:block;background:var(--soft);overflow:hidden}
.ph.main{aspect-ratio:1390/1800}
.ph img{position:relative;z-index:1;display:block;width:100%;height:100%;object-fit:cover}
.ph-fb{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#a6a6a6;font-size:13px}
.ph-fb .ico{width:46px;height:46px}
.ph.sm .ph-fb .ico{width:22px;height:22px}
.media-edit{position:absolute;z-index:3;left:16px;top:16px;display:flex;align-items:center;gap:8px;height:40px;padding:0 16px;background:#fff;border:1px solid var(--edit);color:var(--edit);font-size:13.5px;font-weight:600;border-radius:2px}
.media-edit .ico{width:16px;height:16px}
.info{max-width:480px;width:100%}
.p-name{font-size:26px;line-height:1.2;font-weight:600;margin:2px 0 6px;letter-spacing:-.01em}
.p-ref{margin:0;color:var(--muted);font-size:12.5px}
.p-price{font-size:21px;font-weight:600;margin:14px 0 22px}
.lbl{font-size:13.5px;color:var(--ink-2)}
.p-colour{margin-bottom:22px}
.swatches{display:flex;gap:8px;margin-top:10px}
.sw{width:52px;height:60px;padding:2px;border:1px solid var(--ink)}
.sw .ph{width:100%;height:100%}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.link-sm{font-size:12.5px;color:var(--ink-2);text-underline-offset:3px}
.sizes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.sz{height:46px;border:1px solid var(--line-2);font-size:14px;font-weight:500;text-align:center;border-radius:2px;background:#fff}
.sz:hover{border-color:var(--ink)}
.sz[aria-checked="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sz.out{color:var(--off);background:linear-gradient(to top right,#fff calc(50% - .6px),var(--line-2) 50%,#fff calc(50% + .6px))}
.stock-msg{font-size:13px;margin:10px 0 18px;color:var(--ink-2);display:flex;align-items:center;gap:7px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.dot.low{background:var(--low)}
.dot.off{background:var(--off)}
.btn-primary{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:52px;padding:0 22px;background:var(--ink);color:#fff;font-weight:600;font-size:15px;border-radius:2px;text-align:center}
.btn-primary:hover{background:#000}
.btn-primary:disabled{background:#a9a9a9}
.btn-ghost{display:flex;align-items:center;justify-content:center;width:100%;height:50px;padding:0 20px;border:1px solid var(--ink);font-weight:600;font-size:14.5px;border-radius:2px;background:#fff;text-align:center}
.btn-ghost:hover{background:var(--soft)}
.w-auto{width:auto;display:inline-flex}

/* Bloc promesse */
.promise{margin-top:28px;border:1px solid var(--line-2);background:#fff}
.promise-hd{padding:18px 20px 16px;border-bottom:1px solid var(--line)}
.promise-title{font-size:15px;font-weight:600;margin:0}
.promise-hint{margin:3px 0 12px;font-size:13px;color:var(--muted)}
.cp-form{display:flex;gap:8px}
.cp-form input{flex:1;min-width:0;height:44px;border:1px solid var(--line-2);border-radius:2px;padding:0 14px;font-size:15px;background:#fff}
.cp-form input:focus{outline:2px solid var(--focus);outline-offset:-1px}
.cp-form button{height:44px;padding:0 20px;background:var(--ink);color:#fff;font-weight:600;border-radius:2px;white-space:nowrap}
.err{color:var(--err);font-size:12.5px;margin:8px 0 0}
.dest{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px;font-size:14px}
.dest-l{display:flex;align-items:center;gap:8px}
.dest-l .ico{width:18px;height:18px}
.link{text-decoration:underline;text-underline-offset:3px;font-size:13px;color:var(--ink-2)}
.pl{display:grid;grid-template-columns:24px minmax(0,1fr) auto;column-gap:14px;padding:15px 20px;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}
.pl-ico{color:var(--ink);padding-top:1px}
.pl-ico .ico{width:22px;height:22px}
.pl-title{font-size:14px;font-weight:600;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.pl-when{display:block;font-size:14px;margin-top:2px}
.when{display:inline-flex;align-items:center;gap:7px;font-weight:600}
.when.fast{color:var(--ok)}
.when .dot{background:var(--ink-2)}
.when.fast .dot{background:var(--ok)}
.pl-sub{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.pl-fee{font-size:14px;font-weight:600;white-space:nowrap;text-align:right}
.free{color:var(--ok)}
.tbc{display:inline-block;margin-top:3px;font-size:12px;color:var(--muted);border:1px dashed #9b9b9b;border-radius:999px;padding:1px 10px}
.pl.off .pl-ico,.pl.off .pl-title{color:var(--off)}
.off-txt{color:var(--off);font-size:13px}
.count{color:var(--ink-2);font-weight:500}
.co2{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--ok);background:var(--ok-bg);border-radius:999px;padding:1px 8px 1px 6px}
.co2 .ico{width:12px;height:12px}

/* Accordéons */
.acc{margin-top:28px;border-top:1px solid var(--line)}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{list-style:none;cursor:pointer;padding:16px 0;font-weight:600;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"";width:8px;height:8px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg);margin:0 4px 4px 0}
.acc details[open] summary::after{transform:rotate(-135deg);margin-bottom:-4px}
.acc-b{margin:0;padding:0 0 18px;font-size:14px;color:var(--ink-2);max-width:62ch}

/* Tiroir panier */
.scrim{position:fixed;inset:0;background:rgba(20,20,20,.38);z-index:80;animation:fade .2s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:#fff;z-index:81;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);box-shadow:-12px 0 40px rgba(0,0,0,.12);animation:slide .32s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}}
.dr-hd{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 16px 20px;border-bottom:1px solid var(--line)}
.dr-hd h2{margin:0;font-size:16px;font-weight:600;display:flex;gap:8px;align-items:center}
.dr-hd h2 .ico{width:20px;height:20px;color:var(--ok)}
.dr-body{flex:1;overflow:auto;padding:20px}
.item{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:14px;align-items:start}
.item .ph{width:76px;aspect-ratio:1390/1800}
.item-name{font-weight:600;font-size:14px;margin:0 0 4px}
.item-meta{font-size:12.5px;color:var(--muted);margin:0}
.item-price{font-weight:600;font-size:14px;margin:0;white-space:nowrap}
.mini{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
.mini h3{font-size:13.5px;margin:0 0 12px;font-weight:600}
.mini-row{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:10px;font-size:13px;margin-bottom:10px;align-items:start}
.mini-row .ico{width:18px;height:18px}
.mini-row strong{font-weight:600}
.mini-w{display:block;color:var(--ok);font-weight:600}
.mini-w.slow{color:var(--ink-2)}
.mini-p{font-size:12.5px;color:var(--muted)}
.dr-ft{padding:16px 20px;border-top:1px solid var(--line);display:grid;gap:10px}

/* Panier */
.cart{max-width:1180px;margin:0 auto;padding:32px 32px 72px}
.cart h1{font-size:26px;font-weight:600;margin:0 0 24px;letter-spacing:-.01em}
.h-muted{font-weight:400;color:var(--muted);font-size:17px}
.cart-grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:48px;align-items:start}
.cline{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:20px;padding:20px 0;border-top:1px solid var(--line)}
.cline:last-of-type{border-bottom:1px solid var(--line)}
.cline .ph{width:104px;aspect-ratio:1390/1800}
.cl-acts{display:flex;align-items:center;gap:16px;margin-top:14px;flex-wrap:wrap}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);height:38px;border-radius:2px}
.qty button{width:36px;height:36px;font-size:18px;text-align:center}
.qty button:disabled{color:var(--off)}
.qty span{min-width:26px;text-align:center;font-weight:600;font-size:14px}
.rm{font-size:12.5px;text-decoration:underline;text-underline-offset:3px;color:var(--muted)}
.cart-prom{margin-top:28px}
.cart-prom .promise{margin-top:0}
.sum{background:var(--soft);padding:24px}
.sum h2{font-size:17px;margin:0 0 14px;font-weight:600}
.srow{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin:8px 0}
.srow .free{font-weight:600}
.srow.tot{font-size:17px;font-weight:700;border-top:1px solid var(--line-2);padding-top:14px;margin:14px 0 18px}
.pay-note{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--muted);margin:12px 0 0;text-align:center}
.pay-note .ico{width:14px;height:14px}
.back-link{display:inline-block;margin-top:16px;font-size:13px;text-decoration:underline;text-underline-offset:3px;color:var(--ink-2)}
.empty{padding:40px 0;border-top:1px solid var(--line)}
.empty p{margin:0 0 18px;color:var(--ink-2)}

/* Checkout */
.co-hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:#fff;border-bottom:1px solid var(--line)}
.co-in{max-width:1180px;margin:0 auto;padding:0 32px;height:68px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.steps{display:flex;gap:26px;list-style:none;margin:0;padding:0;font-size:13px;color:var(--muted);counter-reset:st}
.steps li{display:flex;align-items:center;gap:8px;counter-increment:st}
.steps li::before{content:counter(st);width:22px;height:22px;border-radius:50%;border:1px solid var(--line-2);display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:600}
.steps li.done{color:var(--ink-2)}
.steps li.done::before{content:"✓";background:var(--ink-2);border-color:var(--ink-2);color:#fff}
.steps li.cur{color:var(--ink);font-weight:600}
.steps li.cur::before{border-color:var(--ink);background:var(--ink);color:#fff}
.secure{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.secure .ico{width:16px;height:16px}
.co{max-width:1180px;margin:0 auto;padding:24px 32px 72px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:56px;align-items:start}
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--ink-2);margin-bottom:14px}
.back .ico{width:16px;height:16px}
.co-sec{padding:24px 0 28px;border-top:1px solid var(--line)}
.co-sec h2{font-size:18px;font-weight:600;margin:0 0 18px;display:flex;align-items:center;gap:10px}
.n{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.fld.full{grid-column:1/-1}
.fld label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:5px}
.fld input{width:100%;height:46px;border:1px solid var(--line-2);border-radius:2px;padding:0 13px;font-size:15px;background:#fff}
.fld input:focus{outline:2px solid var(--focus);outline-offset:-1px}
.fld.has-err input{border-color:var(--err)}
.fld-err{color:var(--err);font-size:12px;margin:4px 0 0}
.muted-p{color:var(--muted);font-size:14px;margin:0}
.opt{border:1px solid var(--line-2);margin-bottom:10px;border-radius:2px;background:#fff}
.opt.is-sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.opt-row{display:grid;grid-template-columns:18px 24px minmax(0,1fr) auto;gap:12px;align-items:start;padding:16px;cursor:pointer}
.opt.off .opt-row{cursor:not-allowed}
.opt.off .pl-ico,.opt.off .pl-title{color:var(--off)}
.opt-row input{margin:2px 0 0;accent-color:var(--ink);width:17px;height:17px}
.opt-det{padding:0 16px 16px 86px;font-size:13px;color:var(--ink-2)}
.opt-det p{margin:0}
.det-lbl{font-weight:600;color:var(--ink);margin-bottom:8px !important}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.slot{height:40px;padding:0 14px;border:1px solid var(--line-2);font-size:13.5px;font-weight:500;border-radius:2px;background:#fff}
.slot:hover{border-color:var(--ink)}
.slot[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.chs{display:grid;gap:8px}
.ch{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:10px;padding:12px 14px;border:1px solid var(--line);cursor:pointer;background:#fff;border-radius:2px;font-size:13px;align-items:start}
.ch input{margin:2px 0 0;accent-color:var(--ink);width:16px;height:16px}
.ch.is-sel{border-color:var(--ink)}
.ch.dis{color:var(--off);cursor:not-allowed}
.ch strong{font-size:13.5px;color:var(--ink)}
.ch.dis strong{color:var(--off)}
.ch .ok-t{color:var(--ok);font-weight:600}
.ch-km{color:var(--muted);white-space:nowrap}
.parcels{margin-top:8px !important;color:var(--muted)}
.demo-note{font-size:12.5px;color:var(--muted);margin:12px 0 0}
.co-sum{position:sticky;top:calc(env(safe-area-inset-top,0px) + 88px);background:var(--soft);padding:24px}
.co-sum h2{font-size:17px;margin:0 0 16px;font-weight:600}
.co-items{display:grid;gap:14px;margin-bottom:18px}
.co-items .item{grid-template-columns:56px minmax(0,1fr) auto}
.co-items .ph{width:56px}
.sp{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;background:#fff;border:1px solid var(--line);padding:14px;margin:0 0 18px;font-size:13px}
.sp .ico{width:20px;height:20px}
.sp-t{font-weight:600;margin:0}
.sp-w{color:var(--ok);font-weight:600;margin:2px 0}
.sp-a{color:var(--muted);margin:0}
.err-box{color:var(--err);font-size:12.5px;margin:10px 0 0;text-align:center}

/* Confirmation */
.conf{max-width:760px;margin:0 auto;padding:48px 32px 80px}
.conf-ok{width:52px;height:52px;border-radius:50%;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.conf-ok .ico{width:26px;height:26px}
.conf h1{font-size:28px;line-height:1.2;margin:0 0 8px;font-weight:600;letter-spacing:-.01em}
.conf-lead{color:var(--ink-2);margin:0 0 28px}
.conf-card{border:1px solid var(--line-2);padding:24px;margin-bottom:20px}
.conf-k{font-size:13px;color:var(--muted);margin:0}
.conf-when{font-size:22px;line-height:1.25;font-weight:600;color:var(--ok);margin:4px 0 6px}
.conf-place{margin:0;color:var(--ink-2);font-size:14px}
.tl{list-style:none;margin:22px 0 0;padding:20px 0 0;border-top:1px solid var(--line)}
.tl li{position:relative;padding:0 0 18px 30px}
.tl li::before{content:"";position:absolute;left:4px;top:5px;width:12px;height:12px;border-radius:50%;border:2px solid var(--line-2);background:#fff;box-sizing:border-box}
.tl li::after{content:"";position:absolute;left:9.5px;top:19px;bottom:0;width:1.5px;background:var(--line)}
.tl li:last-child{padding-bottom:0}
.tl li:last-child::after{display:none}
.tl li.done::before{background:var(--ok);border-color:var(--ok)}
.tl-t{display:block;font-weight:600;font-size:14px}
.tl-s{display:block;font-size:13px;color:var(--muted)}
.conf-tot{display:flex;justify-content:space-between;font-weight:600;border-top:1px solid var(--line);margin-top:16px;padding-top:14px}

/* Footer */
.reass{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:8px}
.reass-in{max-width:1320px;margin:0 auto;padding:22px 32px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.reass-it{display:flex;gap:12px;align-items:center;font-size:13.5px;font-weight:500}
.reass-it .ico{width:24px;height:24px}
.ftr-in{max-width:1320px;margin:0 auto;padding:36px 32px 28px;display:grid;grid-template-columns:repeat(3,1fr) 1.3fr;gap:32px;font-size:13.5px}
.ftr h3{font-size:13.5px;font-weight:600;margin:0 0 12px}
.ftr ul{list-style:none;margin:0;padding:0;display:grid;gap:8px;color:var(--ink-2)}
.ftr a{text-decoration:none}
.ftr a:hover{text-decoration:underline}
.nl p{margin:0 0 12px;color:var(--ink-2)}
.nl-f{display:flex;border:1px solid var(--line-2);border-radius:2px}
.nl-f input{flex:1;min-width:0;border:0;height:42px;padding:0 12px;font-size:13.5px;outline:0}
.nl-f button{padding:0 16px;font-weight:600;font-size:13px;border-left:1px solid var(--line-2)}
.nl-f:focus-within{outline:2px solid var(--focus)}
.ftr-bt{max-width:1320px;margin:0 auto;padding:16px 32px 88px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}

/* Outils de démo */
.clock{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;align-items:center;gap:7px;height:34px;padding:0 14px 0 11px;border-radius:17px;background:rgba(26,26,26,.88);color:#fff;font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.clock .ico{width:15px;height:15px}
.edit-fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;gap:8px;align-items:center;height:40px;padding:0 16px;border-radius:20px;background:#fff;border:1px solid var(--line-2);box-shadow:0 4px 18px rgba(0,0,0,.12);font-size:13.5px;font-weight:600}
.edit-fab .ico{width:16px;height:16px}
.edit-bar{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;background:#fff;border:1.5px solid var(--edit);box-shadow:0 8px 28px rgba(0,0,0,.16);padding:14px 16px;width:min(380px,calc(100% - 32px));border-radius:4px}
.edit-bar p{margin:0 0 12px;font-size:13px;color:var(--ink-2)}
.edit-bar strong{color:var(--ink)}
.edit-acts{display:flex;gap:8px;justify-content:flex-end}
.btn-sm{height:38px;width:auto;padding:0 16px;font-size:13.5px}
.edit-msg{font-size:12.5px;margin:10px 0 0 !important;color:var(--ink)}
.is-editing [data-edit]{outline:1px dashed var(--edit);outline-offset:2px;border-radius:1px;cursor:text;min-width:1.5ch}
.is-editing span[data-edit]{display:inline-block}
.is-editing [data-edit]:hover{background:rgba(31,92,224,.07)}
.is-editing [data-edit]:focus{outline:2px solid var(--edit);background:rgba(31,92,224,.08)}
.is-editing [data-edit]:empty::before{content:"…";color:var(--off)}
.toast{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:90;background:var(--ink);color:#fff;font-size:13.5px;padding:10px 16px;border-radius:4px;max-width:calc(100% - 32px)}

@media (prefers-reduced-motion:reduce){.drawer,.scrim{animation:none}}

@media (max-width:1020px){
  .hdr-in{grid-template-columns:auto 1fr auto;padding:0 12px;height:60px;gap:4px}
  .nav,.search,.ib.opt-hide{display:none}
  .burger{display:inline-flex}
  .logo{font-size:17px}
  .mnav{display:block;border-top:1px solid var(--line);padding:4px 16px 12px}
  .mnav a{display:block;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;font-weight:500}
  .mnav a:last-child{border-bottom:0}
}
@media (max-width:900px){
  .pdp{grid-template-columns:1fr;gap:22px;padding:0 0 56px}
  .media{position:relative;top:auto}
  .info{max-width:none;padding:0 16px}
  .crumbs{padding:12px 16px}
  .cart{padding:20px 16px 64px}
  .cart-grid{grid-template-columns:1fr;gap:28px}
  .co{grid-template-columns:1fr;padding:14px 16px 64px;gap:4px}
  .co-sum{position:static}
  .co-in{padding:0 16px;height:60px}
  .steps{display:none}
  .opt-det{padding-left:16px}
  .reass-in{grid-template-columns:1fr 1fr;padding:18px 16px}
  .ftr-in{grid-template-columns:1fr 1fr;padding:28px 16px}
  .ftr-bt{padding:16px 16px 88px}
  .conf{padding:32px 16px 72px}
}
@media (max-width:520px){
  .grid2{grid-template-columns:1fr}
  .cline{grid-template-columns:80px minmax(0,1fr);gap:14px}
  .cline .ph{width:80px}
  .cline .item-price{grid-column:2}
  .pl{padding:14px 16px;column-gap:12px}
  .promise-hd{padding:16px}
  .opt-row{grid-template-columns:18px minmax(0,1fr) auto;padding:14px}
  .opt-row .pl-ico{display:none}
  .ftr-in{grid-template-columns:1fr}
}
</style>

/* ---------- Horloge de démo ---------- */
const PRESETS = ['10:00', '13:00', '17:30', '19:30', 'now'];
let clockIdx = 0, customTime = null;
try {
  const q = new URLSearchParams(location.search).get('time');
  if (q) {
    if (/^(now|real|live)$/i.test(q)) clockIdx = 4;
    else if (/^\d{1,2}[:h]\d{2}$/i.test(q)) {
      const norm = q.toLowerCase().replace('h', ':').padStart(5, '0');
      const i = PRESETS.indexOf(norm);
      if (i >= 0) clockIdx = i; else customTime = norm;
    }
  }
} catch (e) { /* paramètre ignoré */ }
function now() {
  const d = new Date();
  const p = customTime || PRESETS[clockIdx];
  if (p === 'now') return d;
  const [h, m] = p.split(':').map(Number);
  d.setHours(h, m, 0, 0);
  return d;
}
const clockLabel = () => { const p = customTime || PRESETS[clockIdx]; return p === 'now' ? 'Heure réelle' : 'Démo ' + p; };

/* ---------- Calendrier ---------- */
const WD = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
const MO = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const FIXED_HOL = ['01-01', '05-01', '05-08', '07-14', '08-15', '11-01', '11-11', '12-25'];
const MOVE_HOL = ['2026-04-06', '2026-05-14', '2026-05-25', '2027-03-29', '2027-05-06', '2027-05-17', '2028-04-17', '2028-05-25', '2028-06-05'];
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const isHol = d => FIXED_HOL.includes(ymd(d).slice(5)) || MOVE_HOL.includes(ymd(d));
const isWorkday = d => d.getDay() >= 1 && d.getDay() <= 5 && !isHol(d);
const isDelivDay = d => d.getDay() !== 0 && !isHol(d);
const isStoreDay = isDelivDay;
const startOfDay = d => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
function nextDay(d, pred) { let x = addDays(startOfDay(d), 1); while (!pred(x)) x = addDays(x, 1); return x; }
function addN(d, n, pred) { let x = startOfDay(d); for (let i = 0; i < n; i++) x = nextDay(x, pred); return x; }
const hours = t => t.getHours() + t.getMinutes() / 60;
function shipDay(t, cutoffH) { const today = startOfDay(t); return (isWorkday(today) && hours(t) < cutoffH) ? today : nextDay(today, isWorkday); }
const sameDay = (a, b) => ymd(a) === ymd(b);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const dnum = d => d.getDate() === 1 ? '1er' : String(d.getDate());
const dayShort = d => WD[d.getDay()] + ' ' + dnum(d) + ' ' + MO[d.getMonth()];
function dayWord(d, t) { if (sameDay(d, t)) return 'Aujourd’hui'; if (sameDay(d, addDays(t, 1))) return 'Demain'; return cap(dayShort(d)); }
function range(a, b) {
  if (sameDay(a, b)) return cap(dayShort(a));
  if (a.getMonth() === b.getMonth()) return cap(WD[a.getDay()] + ' ' + dnum(a) + ' – ' + WD[b.getDay()] + ' ' + dnum(b) + ' ' + MO[b.getMonth()]);
  return cap(dayShort(a) + ' – ' + dayShort(b));
}
const fmtH = h => { const H = Math.floor(h), M = Math.round((h - H) * 60); return M ? H + 'h' + pad(M) : H + 'h'; };
function dur(mins) { mins = Math.max(1, Math.round(mins)); const h = Math.floor(mins / 60), m = mins % 60; return h ? (m ? h + NB + 'h' + NB + pad(m) : h + NB + 'h') : m + NB + 'min'; }

/* ---------- Géographie ---------- */
function validCp(cp) { if (!/^\d{5}$/.test(cp || '')) return false; const d = +cp.slice(0, 2); return (d >= 1 && d <= 95) || d === 97 || d === 98; }
const CITY = { '59000': 'Lille', '33000': 'Bordeaux', '31000': 'Toulouse', '44000': 'Nantes', '67000': 'Strasbourg', '06000': 'Nice', '35000': 'Rennes', '34000': 'Montpellier', '87000': 'Limoges', '92100': 'Boulogne-Billancourt', '92130': 'Issy-les-Moulineaux', '92200': 'Neuilly-sur-Seine', '92300': 'Levallois-Perret', '93100': 'Montreuil', '94300': 'Vincennes' };
function cityOf(cp) {
  if (/^75\d{3}$/.test(cp)) return 'Paris';
  if (/^6900[1-9]$/.test(cp)) return 'Lyon';
  if (/^130(0[1-9]|1[0-6])$/.test(cp)) return 'Marseille';
  return CITY[cp] || '';
}
function hashStr(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return Math.abs(h); }
function kmTo(s, cp) { if (s.cp === cp) return 0.6; if (s.cp.slice(0, 2) === cp.slice(0, 2)) return 1.8 + (hashStr(s.id + cp) % 20) / 10; return 6 + (hashStr(s.id + cp) % 60) / 10; }
function nearby(cp) { const d = cp.slice(0, 2); return cfg.stores.filter(s => (s.zone || []).includes(d)).map(s => ({ s, km: kmTo(s, cp) })).sort((a, b) => a.km - b.km); }
const fmtKm = k => k.toFixed(1).replace('.', ',') + NB + 'km';
function relays(cp, city) {
  const c = city || cityOf(cp) || '';
  if (cp === '75015') return [
    { name: 'Relais Lecourbe', address: '98 rue Lecourbe, 75015 Paris', km: 0.3, hours: 'Ouvert jusqu’à 19h30' },
    { name: 'Tabac de la Convention', address: '141 rue de la Convention, 75015 Paris', km: 0.7, hours: 'Ouvert jusqu’à 20h' },
    { name: 'Librairie Vaugirard', address: '302 rue de Vaugirard, 75015 Paris', km: 1.1, hours: 'Ouvert jusqu’à 19h' }
  ];
  return [
    { name: 'Relais Centre-ville', address: ('5 place de la Mairie, ' + cp + ' ' + c).trim(), km: 0.5, hours: 'Ouvert jusqu’à 19h' },
    { name: 'Tabac Presse de la Gare', address: ('12 avenue de la Gare, ' + cp + ' ' + c).trim(), km: 0.9, hours: 'Ouvert jusqu’à 20h' },
    { name: 'Supérette du Marché', address: ('28 rue du Marché, ' + cp + ' ' + c).trim(), km: 1.4, hours: 'Ouvert jusqu’à 21h' }
  ];
}

/* ---------- Stock ---------- */
const stS = (s, z) => (s.stock && +s.stock[z]) || 0;
const stW = z => (cfg.warehouse && +cfg.warehouse[z]) || 0;
const stTot = z => stW(z) + cfg.stores.reduce((a, s) => a + stS(s, z), 0);
const qtyMax = z => Math.min(9, Math.max(stW(z), ...cfg.stores.map(s => stS(s, z))));
const hasAll = (s, lines) => lines.every(l => stS(s, l.size) >= l.qty);
function parcels(lines, cp) {
  const near = validCp(cp) ? nearby(cp).map(n => n.s) : [];
  const order = near.concat(cfg.stores.filter(s => !near.includes(s)));
  const groups = [];
  for (const l of lines) {
    const src = stW(l.size) >= l.qty ? 'wh' : (order.find(s => stS(s, l.size) >= l.qty) || null);
    if (!src) return null;
    let g = groups.find(x => x.src === src);
    if (!g) { g = { src, lines: [] }; groups.push(g); }
    g.lines.push(l);
  }
  return groups;
}
const srcLabel = src => src === 'wh' ? 'notre entrepôt' : 'le magasin ' + src.name;
function missingReason(lines, near) {
  const miss = lines.filter(l => !near.some(n => stS(n.s, l.size) >= l.qty));
  if (miss.length) return 'Taille ' + miss.map(l => l.size).join(', ') + ' indisponible dans les magasins proches';
  return 'Articles disponibles dans des magasins différents';
}

/* ---------- Moteur de promesse ---------- */
function slots2h(t) {
  const starts = [12, 14, 16];
  const today = startOfDay(t);
  if (isStoreDay(today)) {
    const av = starts.filter(s => s - 1.5 >= hours(t));
    if (av.length) { const c = new Date(today); c.setMinutes((av[0] - 1.5) * 60); return { day: today, slots: av.map(s => ({ start: s, end: s + 2 })), cutoff: c }; }
  }
  return { day: nextDay(today, isStoreDay), slots: starts.map(s => ({ start: s, end: s + 2 })), cutoff: null };
}
function ccReady(t) {
  const today = startOfDay(t);
  if (isStoreDay(today) && hours(t) < 19) return { day: today, h: Math.max(11, Math.ceil((hours(t) + 1) * 2) / 2) };
  return { day: nextDay(today, isStoreDay), h: 11 };
}
const ccTransfer = t => ({ day: addN(shipDay(t, 14), 3, isStoreDay), h: 14 });
function readyLabel(x, t) { if (x.transfer) return 'Dès le ' + dayShort(x.ready.day); return dayWord(x.ready.day, t) + ' dès ' + fmtH(x.ready.h); }

function computePromise(lines, cp, t, subtotal) {
  const has = validCp(cp);
  const d = has ? cp.slice(0, 2) : '';
  const corse = d === '20', om = d === '97' || d === '98';
  const near = has && !om ? nearby(cp) : [];
  const pc = parcels(lines, cp);
  const free = subtotal >= (+cfg.fees.freeFrom || Infinity);
  const today = startOfDay(t);
  const tomorrow = addDays(today, 1);
  const out = [];

  const o2 = { id: '2h', icon: 'bolt', title: 'Livraison express en 2h', fee: +cfg.fees.express2h, feePath: 'fees.express2h' };
  if (!has) o2.status = 'pending';
  else if (om) { o2.status = 'off'; o2.reason = 'Non disponible en outre-mer'; }
  else if (!near.length) { o2.status = 'off'; o2.reason = 'Pas de magasin assez proche de ' + cp; }
  else {
    const src = near.find(n => hasAll(n.s, lines));
    if (!src) { o2.status = 'off'; o2.reason = missingReason(lines, near); }
    else {
      const sl = slots2h(t);
      Object.assign(o2, { status: 'ok', store: src.s, day: sl.day, slots: sl.slots, fast: true });
      o2.when = dayWord(sl.day, t) + ' entre ' + fmtH(sl.slots[0].start) + ' et ' + fmtH(sl.slots[0].end);
      if (sl.cutoff) o2.countdown = (sl.cutoff - t) / 60000;
      o2.subHtml = 'Préparé au magasin ' + edStore(src.s) + ', livré par coursier';
    }
  }
  out.push(o2);

  const oc = { id: 'cc', icon: 'store', title: 'Retrait en magasin', fee: 0, co2: true };
  if (!has) { oc.status = 'pending'; oc.subHtml = 'Indiquez votre code postal pour voir les magasins'; }
  else if (!near.length) { oc.status = 'off'; oc.reason = 'Aucun magasin à proximité de ' + cp; }
  else {
    const whOk = lines.every(l => stW(l.size) >= l.qty);
    oc.stores = near.map(n => { const ok = hasAll(n.s, lines); return { s: n.s, km: n.km, ok, transfer: !ok && whOk, ready: ok ? ccReady(t) : (whOk ? ccTransfer(t) : null) }; });
    const best = oc.stores.find(x => x.ok) || oc.stores.find(x => x.transfer);
    if (!best) { oc.status = 'off'; oc.reason = missingReason(lines, near); }
    else {
      Object.assign(oc, { status: 'ok', store: best.s, pick: best, when: readyLabel(best, t) });
      oc.fast = !best.transfer && (sameDay(best.ready.day, today) || sameDay(best.ready.day, tomorrow));
      const stock = best.ok && lines.length === 1 ? ', ' + stS(best.s, lines[0].size) + ' en stock' : '';
      oc.subHtml = best.transfer ? 'Au magasin ' + edStore(best.s) + ', envoyé depuis notre entrepôt' : 'Au magasin ' + edStore(best.s) + ', à ' + fmtKm(best.km) + stock;
    }
  }
  out.push(oc);

  const oe = { id: 'express', icon: 'truck', title: 'Livraison express à domicile', fee: +cfg.fees.express, feePath: 'fees.express' };
  if (!has) oe.status = 'pending';
  else if (corse || om) { oe.status = 'off'; oe.reason = corse ? 'Non disponible en Corse' : 'Non disponible en outre-mer'; }
  else if (!pc) { oe.status = 'off'; oe.reason = 'Stock insuffisant pour cette quantité'; }
  else {
    const sd = shipDay(t, 15), dd = addN(sd, 1, isDelivDay);
    Object.assign(oe, { status: 'ok', day: dd, when: dayWord(dd, t) + ' avant 13h', fast: sameDay(dd, tomorrow) || sameDay(dd, today), parcels: pc });
    if (sameDay(sd, today)) oe.subHtml = 'Commandez avant 15h';
  }
  out.push(oe);

  const freeNote = 'Offerte dès ' + edNum('fees.freeFrom');
  const oh = { id: 'home', icon: 'box', title: 'Livraison à domicile', fee: free ? 0 : +cfg.fees.home, feePath: 'fees.home' };
  if (om) { oh.status = 'off'; oh.reason = 'Non disponible en outre-mer'; }
  else if (!pc) { oh.status = 'off'; oh.reason = 'Stock insuffisant pour cette quantité'; }
  else {
    const sd = shipDay(t, 14), x = corse ? 2 : 0, a = addN(sd, 2 + x, isDelivDay), b = addN(sd, 3 + x, isDelivDay);
    Object.assign(oh, { status: 'ok', day: a, dayTo: b, when: range(a, b), parcels: pc });
    oh.subHtml = [has ? '' : 'En France métropolitaine', free ? '' : freeNote].filter(Boolean).join('. ');
  }
  out.push(oh);

  const or = { id: 'relay', icon: 'pin', title: 'Livraison en point relais', fee: free ? 0 : +cfg.fees.relay, feePath: 'fees.relay', co2: true };
  if (om) { or.status = 'off'; or.reason = 'Non disponible en outre-mer'; }
  else if (!pc) { or.status = 'off'; or.reason = 'Stock insuffisant pour cette quantité'; }
  else {
    const sd = shipDay(t, 14), x = corse ? 2 : 0, a = addN(sd, 3 + x, isDelivDay), b = addN(sd, 4 + x, isDelivDay);
    Object.assign(or, { status: 'ok', day: a, dayTo: b, when: range(a, b), parcels: pc });
    or.subHtml = [has ? '' : 'En France métropolitaine', free ? '' : freeNote].filter(Boolean).join('. ');
  }
  out.push(or);

  return { cp, city: has ? cityOf(cp) : '', has, options: out.filter(o => o.status !== 'off').concat(out.filter(o => o.status === 'off')) };
}

  const f = S.co.form, errs = {};
  const { t, P } = coPromise();
  const o = validCp(f.cp) ? ensureSel(P) : null;
  ['firstName', 'lastName', 'phone', 'email'].forEach(k => { if (!String(f[k] || '').trim()) errs[k] = 'Champ obligatoire'; });
  if (f.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email.trim())) errs.email = 'Adresse e-mail invalide';
  if (!validCp(f.cp)) errs.cp = 'Code postal à 5 chiffres';
  if (o && ['2h', 'express', 'home'].includes(o.id)) {
    if (!f.street.trim()) errs.street = 'Indiquez votre adresse';
    if (!f.city.trim()) errs.city = 'Indiquez votre ville';
  }
  if (validCp(f.cp) && !o) errs.mode = 'Aucun mode de livraison n’est disponible pour cette adresse.';
  S.co.errors = errs;
  if (Object.keys(errs).length) {
    renderPage();
    const first = ['firstName', 'lastName', 'street', 'cp', 'city', 'phone', 'email'].find(k => errs[k]);
    const el = first && document.getElementById('f-' + first);
    if (el) el.focus();
    return;
  }
  const sub = subtotal(), fee = o.fee;
  let source = '';
  if (o.id === '2h') source = 'magasin ' + o.store.name;
  else if (o.id === 'cc') { const x = o.stores.find(y => y.s.id === S.co.store) || o.pick; source = x.transfer ? 'notre entrepôt' : 'magasin ' + x.s.name; }
  else source = (o.parcels || []).map(g => srcLabel(g.src)).join(' et ');
  const whenTxt = selWhen(o, t), place = selPlace(o);
  const steps = [['Commande confirmée', 'Aujourd’hui à ' + fmtH(hours(t)), true]];
  if (o.id === '2h') steps.push(['Préparation en magasin', 'Magasin ' + o.store.name], ['Remise au coursier', 'Vous recevez un SMS de suivi'], ['Livraison', whenTxt]);
  else if (o.id === 'cc') steps.push([source === 'notre entrepôt' ? 'Envoi vers le magasin' : 'Préparation en magasin', source === 'notre entrepôt' ? 'Depuis notre entrepôt' : cap(source)], ['Prête à retirer', whenTxt + ', vous recevez un SMS'], ['Retrait', 'Sur présentation de l’e-mail de confirmation']);
  else steps.push(['Préparation', 'Depuis ' + source], ['Expédition', 'Vous recevez un e-mail de suivi'], ['Livraison', whenTxt]);
  S.order = {
    no: 'CMD-' + ymd(t).replace(/-/g, '').slice(2) + '-' + (1000 + Math.floor(Math.random() * 9000)),
    title: o.title, icon: o.icon, whenTxt, place, firstName: f.firstName.trim(), email: f.email.trim(),
    items: S.cart.map(l => ({ size: l.size, qty: l.qty })), sub, fee, total: r2(sub + fee), steps, mode: o.id
  };
  S.cart = [];
  go('confirm');
}

/* ---------- Confirmation ---------- */
function confirmHtml() {
  const o = S.order;
  if (!o) return '<main class="conf"><p>Aucune commande en cours.</p><button class="btn-primary w-auto" data-act="restart">Retour à l’article</button></main>';
  const k = o.mode === 'cc' ? 'Retrait en magasin' : o.mode === 'relay' ? 'Livraison en point relais' : o.title;
  return '<main class="conf"><div class="conf-ok">' + ic('check') + '</div>' +
    '<h1>Merci ' + esc(o.firstName) + ', votre commande est confirmée</h1>' +
    '<p class="conf-lead">Commande n° ' + esc(o.no) + '. Un e-mail de confirmation a été envoyé à ' + esc(o.email) + '.</p>' +
    '<section class="conf-card" aria-label="Livraison"><p class="conf-k">' + esc(k) + '</p><p class="conf-when">' + esc(o.whenTxt) + '</p><p class="conf-place">' + esc(o.place) + '</p>' +
      '<ol class="tl">' + o.steps.map(s => '<li' + (s[2] ? ' class="done"' : '') + '><span class="tl-t">' + esc(s[0]) + '</span><span class="tl-s">' + esc(s[1]) + '</span></li>').join('') + '</ol></section>' +
    '<section class="conf-card" aria-label="Articles"><div class="co-items" style="margin:0">' + o.items.map(l => '<div class="item">' + imgHtml('sm') + '<div><p class="item-name">' + ed('product.name') + '</p><p class="item-meta">Taille ' + esc(l.size) + ', quantité ' + l.qty + '</p></div><p class="item-price">' + eur(l.qty * price()) + '</p></div>').join('') + '</div>' +
      '<div class="conf-tot"><span>Total payé</span><span>' + eur(o.total) + '</span></div></section>' +
    '<button class="btn-primary w-auto" data-act="restart">Continuer mes achats</button></main>';
}

/* ---------- Outils de démo (horloge, édition) ---------- */
function chromeHtml() {
  let h = '';
  if (!S.editing) {
    const nextLbl = customTime ? 'Démo 10:00' : (PRESETS[(clockIdx + 1) % PRESETS.length] === 'now' ? 'l’heure réelle' : PRESETS[(clockIdx + 1) % PRESETS.length]);
    h += '<button class="clock" id="clock" data-act="clock" title="Heure simulée pour la démonstration. Cliquer pour passer à ' + esc(nextLbl) + '." aria-label="' + esc(clockLabel()) + '. Cliquer pour changer l’heure de démonstration.">' + ic('clock') + '<span>' + esc(clockLabel()) + '</span></button>';
  }
  if (EDIT.can) {
    if (!S.editing) h += '<button class="edit-fab" id="edit-on" data-act="edit-on">' + ic('pencil') + 'Modifier la page</button>';
    else {
      const dirty = JSON.stringify(cfg) !== saved;
      h += '<div class="edit-bar" role="region" aria-label="Mode édition"><p><strong>Mode édition.</strong> Cliquez sur un texte encadré pour le modifier, sur toutes les pages du parcours' + (EDIT.assets ? ', et sur la photo pour la changer' : '') + '.</p>' +
        '<div class="edit-acts"><button class="btn-ghost btn-sm" data-act="edit-cancel">Annuler</button><button class="btn-primary btn-sm" id="edit-save" data-act="edit-save"' + (!dirty || S.saving ? ' disabled' : '') + '>' + (S.saving ? 'Enregistrement…' : 'Enregistrer') + '</button></div>' +
        (S.editMsg ? '<p class="edit-msg" role="status">' + esc(S.editMsg) + '</p>' : '') +
        (EDIT.assets ? '<input type="file" id="file-in" accept="image/jpeg,image/png,image/webp" hidden>' : '') + '</div>';
    }
  }
  if (S.toast) h += '<div class="toast" role="status">' + esc(S.toast) + '</div>';
  return h;
}
function updateSaveBtn() { const b = document.getElementById('edit-save'); if (b) b.disabled = S.saving || JSON.stringify(cfg) === saved; }
let toastTimer = null;
function toast(msg) { S.toast = msg; renderChrome(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = ''; renderChrome(); }, 4000); }

async function initCaps() {
  if (!window.claude || typeof window.claude.use !== 'function') return;
  try {
    const [art, usr] = await Promise.all([window.claude.use('artifact'), window.claude.use('user')]);
    if (!art || !usr) return;
    let ok = false;
    try { ok = await usr.canEdit(); } catch (e) { ok = false; }
    if (!ok) return;
    EDIT.artifact = art; EDIT.can = true;
    try { EDIT.assets = await window.claude.use('assets'); } catch (e) { EDIT.assets = null; }
    renderChrome();
  } catch (e) { /* page en lecture seule */ }
}
async function save() {
  if (!EDIT.artifact || S.saving) return;
  S.saving = true; S.editMsg = ''; renderChrome();
  try {
    await EDIT.artifact.publish(buildDoc(cfg));
    S.editMsg = 'Enregistré. La page se recharge.';
  } catch (e) {
    const c = e && e.code;
    if (c === 'conflict') S.editMsg = 'Une version plus récente vient d’être publiée : la page se recharge.';
    else if (['not_writer', 'not_granted', 'not_declared', 'consent_required', 'capability_disabled', 'capability_removed'].includes(c)) {
      EDIT.can = false; S.editing = false; cfg = JSON.parse(saved); S.saving = false; render(); toast('Cette page est en lecture seule pour vous.'); return;
    }
    else if (c === 'too_large') S.editMsg = 'La page est trop lourde pour être enregistrée.';
    else if (c === 'rate_limited') S.editMsg = 'Trop d’enregistrements rapprochés. Réessayez dans un instant.';
    else S.editMsg = 'L’enregistrement a échoué. Réessayez.';
  }
  S.saving = false; renderChrome();
}
async function uploadImage(file) {
  if (!EDIT.assets || !file) return;
  S.editMsg = 'Envoi de la photo…'; renderChrome();
  try {
    const r = await EDIT.assets.upload(file);
    cfg.product.image = '/_blob/' + r.id;
    S.editMsg = 'Photo remplacée. Pensez à enregistrer.';
    render();
  } catch (e) {
    const c = e && e.code;
    S.editMsg = c === 'too_large' ? 'Photo trop lourde (20 Mo maximum).' : c === 'unsupported_type' ? 'Format non pris en charge : utilisez JPG, PNG ou WebP.' : 'L’envoi de la photo a échoué.';
    renderChrome();
  }
}

/* ---------- Rendu global ---------- */
const activeId = () => { const a = document.activeElement; return a && a.id ? a.id : null; };
function refocus(id) { if (!id) return; const el = document.getElementById(id); if (el && document.activeElement !== el) { try { el.focus({ preventScroll: true }); } catch (e) { el.focus(); } } }
function postRender(root) {
  if (S.editing) root.querySelectorAll('[data-edit]').forEach(el => { if (el.contentEditable !== 'plaintext-only') el.contentEditable = 'true'; });
  root.querySelectorAll('img[data-pimg]').forEach(img => { if (img.complete && img.naturalWidth === 0 && img.getAttribute('src')) markBroken(img); });
}
function markBroken(img) { const s = img.getAttribute('src'); if (s) broken.add(s); img.remove(); }
function setTitle() { document.title = (cfg.product.name || 'Article') + ' | ' + (cfg.site.logo || 'Boutique'); }
function renderPage() {
  const fid = activeId();
  document.body.classList.toggle('is-editing', S.editing);
  let h;
  if (S.view === 'checkout') h = checkoutHtml();
  else h = topbarHtml() + headerHtml() + (S.view === 'cart' ? cartHtml() : S.view === 'confirm' ? confirmHtml() : pdpHtml()) + footerHtml();
  appEl.innerHTML = h;
  postRender(appEl);
  refocus(fid);
  setTitle();
}
function renderChrome() { const fid = activeId(); chromeEl.innerHTML = drawerHtml() + chromeHtml(); postRender(chromeEl); refocus(fid); }
function render() { renderPage(); renderChrome(); }
function go(view) {
  S.view = view; S.menu = false; S.drawer = false;
  if (view === 'checkout') initCheckout();
  render();
  window.scrollTo(0, 0);
}
function focusSoon(sel) { setTimeout(() => { const el = document.querySelector(sel); if (el) el.focus(); }, 0); }

/* ---------- Actions ---------- */
function addToCart() {
  if (!stTot(S.size)) return;
  const ex = S.cart.find(l => l.size === S.size);
  if (ex) { if (ex.qty < qtyMax(S.size)) ex.qty++; } else S.cart.push({ size: S.size, qty: 1 });
  S.lastAdded = S.size; S.drawer = true;
  render();
  focusSoon('#dr-close');
}
function restart() { S.cart = []; S.cp = ''; S.cpDraft = ''; S.cpEdit = false; S.cpErr = ''; S.co = null; S.order = null; S.size = (cfg.sizes || []).includes('M') ? 'M' : cfg.sizes[0]; go('pdp'); }
function submitCp(form) {
  const input = form.querySelector('input');
  const v = (input.value || '').replace(/\s/g, '');
  const ctx = form.dataset.ctx;
  if (!validCp(v)) {
    S.cpDraft = input.value; S.cpErr = 'Saisissez un code postal français à 5 chiffres, par exemple 75015.';
    renderPage(); focusSoon('#cp-in-' + ctx); return;
  }
  S.cp = v; S.cpDraft = v; S.cpEdit = false; S.cpErr = '';
  if (S.co) { S.co.form.cp = v; if (S.co.autoCity || !S.co.form.city) S.co.form.city = cityOf(v); }
  renderPage(); focusSoon('#cp-edit-' + ctx);
}

document.addEventListener('click', e => {
  if (e.target.closest('a[href="#"]')) e.preventDefault();
  if (S.editing && e.target.closest('[data-edit]')) { e.preventDefault(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  switch (act) {
    case 'home': go('pdp'); break;
    case 'menu': S.menu = !S.menu; renderPage(); break;
    case 'size': S.size = el.dataset.v; renderPage(); break;
    case 'add': addToCart(); break;
    case 'cp-edit': S.cpEdit = true; S.cpDraft = S.cp; S.cpErr = ''; renderPage(); focusSoon('#cp-in-' + el.dataset.ctx); break;
    case 'close-drawer': S.drawer = false; renderChrome(); focusSoon('#add-btn'); break;
    case 'go-cart': go('cart'); break;
    case 'qty': { const l = S.cart[+el.dataset.i]; if (l) { l.qty = Math.max(1, Math.min(qtyMax(l.size), l.qty + (+el.dataset.d))); render(); } break; }
    case 'remove': S.cart.splice(+el.dataset.i, 1); render(); break;
    case 'checkout': if (S.cart.length) go('checkout'); break;
    case 'slot': S.co.slot = +el.dataset.v; updateCo(); break;
    case 'pay': pay(); break;
    case 'restart': restart(); break;
    case 'clock': if (customTime) { customTime = null; clockIdx = 0; } else clockIdx = (clockIdx + 1) % PRESETS.length; render(); break;
    case 'edit-on': S.editing = true; S.editMsg = ''; S.drawer = false; render(); break;
    case 'edit-cancel': cfg = JSON.parse(saved); S.editing = false; S.editMsg = ''; render(); break;
    case 'edit-save': save(); break;
    case 'upload': { const f = document.getElementById('file-in'); if (f) f.click(); break; }
    default: break;
  }
});
document.addEventListener('submit', e => {
  const form = e.target.closest('form[data-form="cp"]');
  if (!form) return;
  e.preventDefault();
  submitCp(form);
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.edit) {
    const path = t.dataset.edit;
    let v = t.textContent;
    if (t.dataset.num) {
      const n = parseFloat(v.replace(/\s/g, '').replace(',', '.').replace(/[^\d.]/g, ''));
      if (!isFinite(n)) return;
      v = r2(n); S.needsRender = true;
    }
    setPath(cfg, path, v);
    document.querySelectorAll('[data-edit="' + path + '"]').forEach(o => { if (o !== t) o.textContent = t.dataset.num ? fmtNum(v) : v; });
    if (path === 'product.name' || path === 'site.logo') setTitle();
    updateSaveBtn();
    return;
  }
  if (t.id && t.id.startsWith('cp-in-')) { S.cpDraft = t.value; return; }
  if (t.dataset && t.dataset.f && S.co) {
    const k = t.dataset.f, v = t.value;
    S.co.form[k] = v;
    if (S.co.errors[k]) { delete S.co.errors[k]; const wrap = t.closest('.fld'); if (wrap) { wrap.classList.remove('has-err'); const p = wrap.querySelector('.fld-err'); if (p) p.remove(); t.removeAttribute('aria-invalid'); } }
    if (S.editing && ['firstName', 'lastName', 'street', 'phone', 'email'].includes(k)) { cfg.customer[k] = v; updateSaveBtn(); }
    if (k === 'cp') {
      const cp = v.replace(/\s/g, '');
      if (validCp(cp)) {
        S.cp = cp; S.cpDraft = cp;
        const c = cityOf(cp);
        if (c && (S.co.autoCity || !S.co.form.city)) { S.co.form.city = c; S.co.autoCity = true; const ci = document.getElementById('f-city'); if (ci) ci.value = c; }
      }
      updateCo();
    } else if (k === 'city') { S.co.autoCity = false; updateCo(); }
    else if (k === 'street' || k === 'extra') updateCo();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'file-in') { uploadImage(t.files && t.files[0]); t.value = ''; return; }
  if (!S.co || t.type !== 'radio') return;
  if (t.name === 'mode') { S.co.mode = t.value; delete S.co.errors.mode; updateCo(); }
  else if (t.name === 'store') { S.co.store = t.value; updateCo(); }
  else if (t.name === 'relay') { S.co.relay = +t.value; updateCo(); }
  else if (t.name === 'pay') { S.co.pay = t.value; updateCo(); }
});
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t.dataset && t.dataset.edit) {
    if (e.key === 'Enter') { e.preventDefault(); t.blur(); }
    if (e.key === 'Escape') t.blur();
    return;
  }
  if (e.key === 'Escape') {
    if (S.drawer) { S.drawer = false; renderChrome(); focusSoon('#add-btn'); }
    else if (S.menu) { S.menu = false; renderPage(); focusSoon('#burger'); }
  }
});
document.addEventListener('focusout', e => {
  const t = e.target;
  if (!(t.dataset && t.dataset.edit)) return;
  if (t.dataset.num) t.textContent = fmtNum(getPath(cfg, t.dataset.edit));
  setTimeout(() => {
    const a = document.activeElement;
    if (S.needsRender && !(a && a.closest && a.closest('[data-edit]'))) { S.needsRender = false; renderPage(); renderChrome(); }
  }, 0);
});
document.addEventListener('paste', e => {
  const t = e.target.closest && e.target.closest('[data-edit]');
  if (!t) return;
  e.preventDefault();
  const txt = ((e.clipboardData || window.clipboardData).getData('text/plain') || '').replace(/\s+/g, ' ');
  document.execCommand('insertText', false, txt);
});
document.addEventListener('toggle', e => { const d = e.target; if (d && d.dataset && d.dataset.acc) S.acc[d.dataset.acc] = d.open; }, true);
document.addEventListener('error', e => { const t = e.target; if (t && t.tagName === 'IMG' && t.hasAttribute('data-pimg')) markBroken(t); }, true);

setInterval(() => {
  const realTime = !customTime && PRESETS[clockIdx] === 'now';
  const a = document.activeElement;
  if (realTime && !S.editing && S.view !== 'checkout' && !(a && a.tagName === 'INPUT')) renderPage();
}, 30000);

render();
initCaps();
})();
</script>
</body>
</html>
